<!-- #region head -->

<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width='device-width', initial-scale=1.0"
    />
    <title>Document</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
  </head>
  <!-- #endregion -->
  <body class="page__content">
    <header class="header">
      <div class="top-bar">
        <a
          href="index.html"
          class="link--img"
        >
          <img
            src="src/images/the-met-logo.svg"
            alt="The Met Logo"
          />
        </a>

        <div class="tob-bar__icons">
          <a
            href="tel:"
            class="icon icon--phone"
          ></a>
          <a
            href="#menu"
            class="icon icon--burger"
          ></a>
        </div>
      </div>

      <div class="header__bottom">
        <h1 class="header__title">
          Welcome
          <br />
          to The MET
        </h1>
      </div>
    </header>

    <aside
      class="menu header__menu"
      id="menu"
    >
      <div class="top-bar menu__top-bar">
        <a
          href="index.html"
          class="logo-link"
        >
          <img
            src="src/images/the-met-logo.svg"
            alt="The Met Logo"
          />
        </a>

        <div class="tob-bar__icons">
          <a
            href="#"
            class="icon icon--close"
          ></a>
        </div>
      </div>

      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item">
            <a
              href="index.html"
              class="nav__link link--text"
            >
              Home
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link link--text"
            >
              About Us
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#now-on-view"
              class="nav__link link--text"
            >
              Now on view
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#explore-online"
              class="nav__link link--text"
            >
              Explore Online
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#contact-us"
              class="nav__link link--text"
            >
              Contacts
            </a>
          </li>
        </ul>

        <div class="nav__bottom">
          <div class="nav__phone-numbers">
            <a
              href="tel:+1 212-535-7710"
              class="nav__number link--text"
            >
              The Met Fifth Avenue
              <br />
              +1 212-535-7710
            </a>

            <a
              href="tel:+1 212-923-3700"
              class="nav__number link--text"
            >
              The Met Cloisters
              <br />
              +1 212-923-3700
            </a>
          </div>

          <a href="tel:" class="nav__call-to-order link--text">call to order</a>
        </div>
      </nav>
    </aside>

    <main class="content">
      <section class="schedule">
        <h2>Museum hours</h2>
      </section>

      <section
        class="now-on-view"
        id="now-on-view"
      >
        <h2>Now On View</h2>
      </section>

      <section
        class="explore-online"
        id="explore-online"
      >
        <h2>More to Explore Online</h2>
      </section>

      <section
        class="contact-us"
        id="contact-us"
      >
        <h2>Contact us</h2>
      </section>
    </main>

    <footer class="footer"></footer>
  </body>
</html>
